<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地球阿爸蓋被仔 3.0 - 探究氣候歷史真相</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: #2c3e50; margin-bottom: 5px; text-align: center; }
        p.subtitle { color: #7f8c8d; margin-top: 0; text-align: center; max-width: 600px; }

        .info-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            margin-bottom: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #2980b9;
        }

        .dashboard {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .stat { text-align: center; flex: 1; }
        .stat-val { font-size: 26px; font-weight: bold; color: #2ecc71; transition: color 0.3s; }
        .stat-label { font-size: 12px; color: #7f8c8d; margin-top: 5px; }

        .game-scene {
            width: 100%;
            max-width: 500px;
            height: 280px;
            background: #dff9fb;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
            border: 2px solid #c7ecee;
        }

        .earth {
            width: 130px;
            height: 130px;
            background: #74b9ff;
            border-radius: 50%;
            position: relative;
            transition: all 0.5s ease;
            border: 4px solid #0984e3;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
        }

        .blanket {
            width: 180px;
            height: 60px; /* 初始較薄 */
            background: rgba(46, 204, 113, 0.4); /* 初始是健康的綠色自然溫室效應 */
            border: 3px solid #2ecc71;
            border-radius: 15px 15px 0 0;
            position: absolute;
            bottom: 60px;
            transition: all 0.5s ease;
            box-sizing: border-box;
            pointer-events: none;
        }

        .log-box {
            width: 100%;
            max-width: 580px;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            min-height: 50px;
            border-left: 5px solid #3498db;
            font-size: 14px;
            line-height: 1.5;
            color: #34495e;
        }

        .controls {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 600px;
        }
        button {
            padding: 12px 10px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            transition: all 0.2s;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }
        button:active { transform: translateY(2px); }
        
        .btn-bad { background-color: #e67e22; }
        .btn-bad:hover { background-color: #d35400; }
        .btn-good { background-color: #3498db; }
        .btn-good:hover { background-color: #2980b9; }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .result-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 500px;
            width: 85%;
        }
        .result-box h2 { margin-top: 0; }
        .restart-btn {
            background: #2ecc71;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            margin-top: 15px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1>🌍 地球阿爸蓋被仔 3.0</h1>
    <p class="subtitle">探究任務：時光倒流到<b>工業革命前</b>。請隨意選擇人類歷史的發展 policy，經歷 6 回合，看看你最終創造的地球環境，能否解開「今日全球暖化」的真相？</p>

    <div class="info-bar">
        <span id="round-display">⏳ 剩餘歷史進程：6 / 6 回合</span>
        <span id="status-tag" style="color:#2ecc71;">年代：工業革命前 (基準線)</span>
    </div>

    <div class="dashboard">
        <div class="stat">
            <div class="stat-val" id="co2-display" style="color:#2ecc71;">280 ppm</div>
            <div class="stat-label">CO₂ 濃度 (1750年基準: 280)</div>
        </div>
        <div class="stat">
            <div class="stat-val" id="temp-display" style="color:#2ecc71;">+0.00 °C</div>
            <div class="stat-label">全球平均升溫</div>
        </div>
        <div class="stat">
            <div class="stat-val" id="thick-display" style="color:#2ecc71;">100%</div>
            <div class="stat-label">被子厚度 (自然溫室效應)</div>
        </div>
    </div>

    <div class="game-scene">
        <div class="earth" id="earth">😊</div>
        <div class="blanket" id="blanket"></div>
    </div>

    <div class="log-box" id="game-log">
        <b>【歷史起點】</b>此時為18世紀工業革命前，溫室氣體濃度適中。這張「天然的被子」鎖住了適量的長波輻射，令地球阿爸睡得非常香甜。請點擊下方按鈕，推動歷史巨輪。
    </div>

    <div class="controls" id="controls-section">
        <button class="btn-bad" onclick="makeChoice('fossil')">🏭 工業化：依賴燃煤發電與重工業</button>
        <button class="btn-bad" onclick="makeChoice('cattle')">🥩 全球化：大興密集式畜牧業（養牛）</button>
        <button class="btn-bad" onclick="makeChoice('deforest')">🪓 土地利用：砍伐熱帶雨林改作農地</button>
        <button class="btn-bad" onclick="makeChoice('landfill')">🗑️ 消費主義：全堆填無回收城市模式</button>

        <button class="btn-good" onclick="makeChoice('carbon-tax')">💰 嚴厲政策：全球徵收高額碳稅</button>
        <button class="btn-good" onclick="makeChoice('efficiency')">💡 技術轉型：全面補貼綠色能源與節能</button>
        <button class="btn-good" onclick="makeChoice('reforest')">🌱 生態保育：跨國大規模重新造林</button>
        <button class="btn-good" onclick="makeChoice('green-farm')">🌾 農業改革：推廣低碳可持續素食農業</button>
    </div>

    <div class="overlay" id="result-overlay">
        <div class="result-box">
            <h2 id="result-title">探究結果</h2>
            <p id="result-desc"></p>
            <button class="restart-btn" onclick="resetGame()">重新探究歷史</button>
        </div>
    </div>

    <script>
        let currentRound = 6;
        let co2 = 280; // 工業革命前真實數據
        let temp = 0.0;
        let blanketThickness = 100;

        const roundEl = document.getElementById('round-display');
        const statusEl = document.getElementById('status-tag');
        const co2El = document.getElementById('co2-display');
        const tempEl = document.getElementById('temp-display');
        const thickEl = document.getElementById('thick-display');
        const blanketEl = document.getElementById('blanket');
        const earthEl = document.getElementById('earth');
        const logEl = document.getElementById('game-log');
        const overlayEl = document.getElementById('result-overlay');
        const resTitleEl = document.getElementById('result-title');
        const resDescEl = document.getElementById('result-desc');

        function updateUI() {
            roundEl.innerText = `⏳ 剩餘歷史進程：${currentRound} / 6 回合`;
            co2El.innerText = `${co2} ppm`;
            tempEl.innerText = `+${temp.toFixed(2)} °C`;
            thickEl.innerText = `${Math.round(blanketThickness)}%`;

            let baseHeight = 60;
            let newHeight = baseHeight * (blanketThickness / 100);
            blanketEl.style.height = `${newHeight}px`;

            // 根據溫度改變顏色與表情
            if (temp >= 1.2) {
                earthEl.innerText = "🥵";
                earthEl.style.backgroundColor = "#ff7675";
                blanketEl.style.backgroundColor = "rgba(231, 76, 60, 0.6)";
                blanketEl.style.borderColor = "#d63031";
                tempEl.style.color = "#d63031";
                co2El.style.color = "#d63031";
                statusEl.innerText = "年代：現代 (全球暖化嚴重)";
                statusEl.style.color = "#d63031";
            } else if (temp >= 0.5) {
                earthEl.innerText = "😓";
                earthEl.style.backgroundColor = "#ffeaa7";
                blanketEl.style.backgroundColor = "rgba(230, 126, 34, 0.5)";
                blanketEl.style.borderColor = "#e67e22";
                tempEl.style.color = "#e67e22";
                co2El.style.color = "#e67e22";
                statusEl.innerText = "年代：20世紀中葉 (暖化初現)";
                statusEl.style.color = "#e67e22";
            } else if (temp <= -0.1) {
                earthEl.innerText = "🥶";
                earthEl.style.backgroundColor = "#a29bfe";
                blanketEl.style.backgroundColor = "rgba(52, 152, 219, 0.3)";
                blanketEl.style.borderColor = "#3498db";
                tempEl.style.color = "#3498db";
                statusEl.innerText = "年代：進入微型冰河期？";
                statusEl.style.color = "#3498db";
            } else {
                earthEl.innerText = "😊";
                earthEl.style.backgroundColor = "#74b9ff";
                blanketEl.style.backgroundColor = "rgba(46, 204, 113, 0.4)";
                blanketEl.style.borderColor = "#2ecc71";
                tempEl.style.color = "#2ecc71";
                co2El.style.color = "#2ecc71";
                statusEl.innerText = "年代：環境平衡期";
                statusEl.style.color = "#2ecc71";
            }
        }

        function makeChoice(action) {
            if (currentRound <= 0) return;
            currentRound--;

            switch(action) {
                case 'fossil':
                    co2 += 25; temp += 0.25; blanketThickness += 15;
                    logEl.innerHTML = "<b>【歷史抉擇：工業化】</b>工廠和發電廠大量燒煤，釋放 $CO_2$。這強化了<b>「增強的溫室效應（Enhanced Greenhouse Effect）」</b>，被子開始加厚！";
                    break;
                case 'cattle':
                    co2 += 10; temp += 0.20; blanketThickness += 12;
                    logEl.innerHTML = "<b>【歷史抉擇：畜牧業】</b>為了應付全球肉類需求而大量養牛，釋放強烈溫室氣體——<b>甲烷（$CH_4$）</b>，被子加速變厚。";
                    break;
                case 'deforest':
                    co2 += 20; temp += 0.18; blanketThickness += 10;
                    logEl.innerHTML = "<b>【歷史抉擇：砍伐雨林】</b>大面積森林被清空。少了樹木（碳匯）吸碳，大氣中的 $CO_2$ 無法被自然移除，留喺大氣圈鎖熱。";
                    break;
                case 'landfill':
                    co2 += 8; temp += 0.12; blanketThickness += 8;
                    logEl.innerHTML = "<b>【歷史抉擇：垃圾堆填】</b>都市廢物在堆填區積聚，缺氧分解產生大量 $CH_4$，將更多長波輻射折射回地面。";
                    break;

                case 'carbon-tax':
                    co2 -= 15; temp -= 0.12; blanketThickness -= 8;
                    logEl.innerHTML = "<b>【歷史抉擇：強制減排】</b>歷史上提早推行碳稅，逼使全球轉型，大氣中的碳增加速度被壓制。";
                    break;
                case 'efficiency':
                    co2 -= 12; temp -= 0.10; blanketThickness -= 6;
                    logEl.innerHTML = "<b>【歷史抉擇：綠色科技】</b>人類主力研發節能與可再生能源，成功減少對化石燃料的依賴，減輕溫室效應。";
                    break;
                case 'reforest':
                    co2 -= 20; temp -= 0.15; blanketThickness -= 10;
                    logEl.innerHTML = "<b>【歷史抉擇：重新造林】</b>全球發起植樹，擴大「碳匯」，主動將大氣中的 $CO_2$ 鎖回植物體內。";
                    break;
                case 'green-farm':
                    co2 -= 8; temp -= 0.08; blanketThickness -= 5;
                    logEl.innerHTML = "<b>【歷史抉擇：生態農業】</b>轉向低碳飲食與有機耕作，減少了一氧化二氮 ($N_2O$) 及甲烷的排放。";
                    break;
            }

            updateUI();

            if (currentRound === 0) {
                setTimeout(endGame, 600);
            }
        }

        function endGame() {
            overlayEl.style.display = "flex";
            
            // 核心探究結論判定
            if (temp >= 1.1 && temp <= 1.6) {
                resTitleEl.innerText = "🎯 成功解開歷史真相！";
                resTitleEl.style.color = "#2ecc71";
                resDescEl.innerHTML = `你最終模擬出的數據是：<b>${co2} ppm</b> 及升溫 <b>+${temp.toFixed(2)}°C</b>。<br><br><b>【地理科總結】</b>這極度接近我們<b>當前現實世界（2026年）</b>的真實數據（真實數據約為 420+ ppm / +1.2 至 +1.5°C）！<br>透過剛才的操作，學生能清楚明白：現在的全球暖化並非自然現象，而是近兩百年來人類不斷選擇工業化、濫伐林木、密集畜牧，令溫室氣體這張「被子」被<b>人為加厚</b>，阻擋了地面長波輻射逃逸而造成的結果！`;
            } else if (temp > 1.6) {
                resTitleEl.innerText = "🔥 創造了「極熱平行時空」";
                resTitleEl.style.color = "#d63031";
                resDescEl.innerHTML = `你最終升溫高達 <b>+${temp.toFixed(2)}°C</b>，遠遠超越了現實世界！<br><br><b>【探究啟示】</b>你瘋狂選擇了高碳排的發展路徑。這張人為加厚的「被子」把地球完全悶透。雖然這不是現在的真實狀況，但如果人類再不收斂，這就是我們的未來。`;
            } else {
                resTitleEl.innerText = "🌿 創造了「烏托邦環保時空」";
                resTitleEl.style.color = "#3498db";
                resDescEl.innerHTML = `你最終升溫只有 <b>+${temp.toFixed(2)}°C</b>，成功保持了冷靜的地球。<br><br><b>【探究啟示】</b>這雖然是一個美好的結局，但它<b>不符合當前現實世界的現狀</b>。這說明了如果人類從一百年前就全力環保，我們本可以避免暖化。請再試一次，嘗試找出「為什麼今天現實世界的溫度會升高 $+1.2°C$ 以上」的人類活動組合！`;
            }
        }

        function resetGame() {
            currentRound = 6;
            co2 = 280;
            temp = 0.0;
            blanketThickness = 100;
            overlayEl.style.display = "none";
            logEl.innerHTML = "<b>【重新探究】</b>時光倒流回1750年。試下搭配不同的政策，引導學生找出通往現代溫度的「歷史真相」！";
            updateUI();
        }

        updateUI();
    </script>
</body>
</html>
