<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地球阿爸蓋被仔 7.0 - 歷史真相與綠色希望</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: #2c3e50; margin-bottom: 5px; text-align: center; }
        p.subtitle { color: #7f8c8d; margin-top: 0; text-align: center; max-width: 600px; font-size: 14px; line-height: 1.4; }

        .info-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            margin-bottom: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #2980b9;
        }

        .dashboard {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .stat { text-align: center; flex: 1; }
        .stat-val { font-size: 26px; font-weight: bold; color: #2ecc71; transition: all 0.3s; }
        .stat-label { font-size: 11px; color: #7f8c8d; margin-top: 5px; }

        .game-scene {
            width: 100%;
            max-width: 500px;
            height: 280px;
            background: #dff9fb;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
            border: 2px solid #c7ecee;
        }

        .earth {
            width: 130px;
            height: 130px;
            background: #74b9ff;
            border-radius: 50%;
            position: relative;
            transition: all 0.5s ease;
            border: 4px solid #0984e3;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
        }

        .blanket {
            width: 180px;
            height: 60px;
            background: rgba(46, 204, 113, 0.4);
            border: 3px solid #2ecc71;
            border-radius: 15px 15px 0 0;
            position: absolute;
            bottom: 60px;
            transition: all 0.5s ease;
            box-sizing: border-box;
            pointer-events: none;
        }

        .log-box {
            width: 100%;
            max-width: 580px;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            min-height: 70px;
            border-left: 5px solid #3498db;
            font-size: 14px;
            line-height: 1.5;
            color: #34495e;
            box-sizing: border-box;
        }

        .controls {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 600px;
        }
        button {
            padding: 12px 10px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            transition: all 0.2s;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }
        button:active { transform: translateY(2px); }
        
        .btn-focus { background-color: #d35400; border: 2px solid #fff; } /* 兩大核心源 */
        .btn-focus:hover { background-color: #e67e22; }
        .btn-bad { background-color: #e67e22; opacity: 0.85; } /* 次要排放源 */
        .btn-bad:hover { background-color: #d35400; }
        .btn-good { background-color: #2ecc71; } /* 低碳生活按鈕，改為充滿希望的綠色 */
        .btn-good:hover { background-color: #27ae60; }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .result-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 550px;
            width: 85%;
        }
        .result-box h2 { margin-top: 0; }
        .restart-btn {
            background: #3498db;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            margin-top: 15px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1>🌍 地球阿爸蓋被仔 7.0</h1>
    <p class="subtitle"><b>探究任務：</b>歷史起點為 0°C。你<b>必須做出 6 次歷史抉擇</b>。請嘗試找出當今現實世界<b>升溫 +1.20°C</b> 背後完整嘅人類活動結構；亦可以嘗試推行低碳生活，看看地球有沒有逆轉的可能？</p>

    <div class="info-bar">
        <span id="round-display">⏳ 剩餘歷史進程：6 / 6 回合</span>
        <span id="status-tag" style="color:#2ecc71;">年代：工業革命前基準</span>
    </div>

    <div class="dashboard">
        <div class="stat">
            <div class="stat-val" id="co2-display" style="color:#2ecc71;">280 ppm</div>
            <div class="stat-label">溫室氣體濃度 (基準: 280)</div>
        </div>
        <div class="stat">
            <div class="stat-val" id="temp-display" style="color:#2ecc71;">+0.00 °C</div>
            <div class="stat-label">全球平均升溫 (目標: +1.20°C)</div>
        </div>
        <div class="stat">
            <div class="stat-val" id="thick-display" style="color:#2ecc71;">100%</div>
            <div class="stat-label">被子厚度 (溫室效應強度)</div>
        </div>
    </div>

    <div class="game-scene">
        <div class="earth" id="earth">😊</div>
        <div class="blanket" id="blanket"></div>
    </div>

    <div class="log-box" id="game-log">
        <b>【探究開始】</b>請連續做出 6 次抉擇。目標係解開現代 +1.20°C 嘅真相，或者嘗試用綠色力量去改變世界！
    </div>

    <div class="controls" id="controls-section">
        <button class="btn-focus" onclick="makeChoice('fossil')">🏭 能源：大量燃煤及化石燃料發電 (+0.30°C)</button>
        <button class="btn-focus" onclick="makeChoice('cattle')">🥩 農業：大規模擴展肉牛放牧業 (+0.20°C)</button>
        <button class="btn-bad" onclick="makeChoice('deforest')">🪓 土地：砍伐熱帶雨林改作農地 (+0.12°C)</button>
        <button class="btn-bad" onclick="makeChoice('landfill')">🗑️ 城市：依賴堆填區處理固體廢物 (+0.08°C)</button>

        <button class="btn-good" onclick="makeChoice('efficiency')">💡 技術：全面補貼綠能與提高能源效益 (-0.15°C)</button>
        <button class="btn-good" onclick="makeChoice('reforest')">🌱 生態：跨國大規模重新造林重建碳匯 (-0.15°C)</button>
        <button class="btn-good" onclick="makeChoice('carbon-tax')">💰 政策：實施碳稅與碳交易強制減排 (-0.10°C)</button>
        <button class="btn-good" onclick="makeChoice('green-farm')">🌾 農業：推廣低碳可持續農業及素食 (-0.10°C)</button>
    </div>

    <div class="overlay" id="result-overlay">
        <div class="result-box">
            <h2 id="result-title">探究結果</h2>
            <p id="result-desc"></p>
            <button class="restart-btn" onclick="resetGame()">重新挑戰 / 探究</button>
        </div>
    </div>

    <script>
        let currentRound = 6;
        let co2 = 280; 
        let temp = 0.0;
        let blanketThickness = 100;

        // 記錄各活動點擊次數
        let counter = { fossil: 0, cattle: 0, deforest: 0, landfill: 0, efficiency: 0, reforest: 0, tax: 0, farm: 0 };
        let greenChoiceCount = 0; // 記錄總共選了多少次綠色環保政策

        const roundEl = document.getElementById('round-display');
        const statusEl = document.getElementById('status-tag');
        const co2El = document.getElementById('co2-display');
        const tempEl = document.getElementById('temp-display');
        const thickEl = document.getElementById('thick-display');
        const blanketEl = document.getElementById('blanket');
        const earthEl = document.getElementById('earth');
        const logEl = document.getElementById('game-log');
        const overlayEl = document.getElementById('result-overlay');
        const resTitleEl = document.getElementById('result-title');
        const resDescEl = document.getElementById('result-desc');

        function updateUI() {
            roundEl.innerText = `⏳ 剩餘歷史進程：${currentRound} / 6 回合`;
            co2El.innerText = `${co2} ppm`;
            tempEl.innerText = `${temp >= 0 ? '+' : ''}${temp.toFixed(2)} °C`;
            thickEl.innerText = `${Math.round(blanketThickness)}%`;

            let baseHeight = 60;
            let newHeight = baseHeight * (blanketThickness / 100);
            if (newHeight < 15) newHeight = 15;
            blanketEl.style.height = `${newHeight}px`;

            if (temp >= 1.2) {
                earthEl.innerText = "🥵";
                earthEl.style.backgroundColor = "#ff7675";
                blanketEl.style.backgroundColor = "rgba(231, 76, 60, 0.6)";
                blanketEl.style.borderColor = "#d63031";
                tempEl.style.color = "#d63031";
                statusEl.innerText = "狀態：現代暖化時空";
                statusEl.style.color = "#d63031";
            } else if (temp >= 0.5) {
                earthEl.innerText = "😓";
                earthEl.style.backgroundColor = "#ffeaa7";
                blanketEl.style.backgroundColor = "rgba(230, 126, 34, 0.5)";
                blanketEl.style.borderColor = "#e67e22";
                tempEl.style.color = "#e67e22";
                statusEl.innerText = "狀態：暖化加劇中";
                statusEl.style.color = "#e67e22";
            } else if (temp < 0.0) {
                earthEl.innerText = "😎"; // 逆轉暖化，地球阿爸覺得好爽
                earthEl.style.backgroundColor = "#55efc4";
                blanketEl.style.backgroundColor = "rgba(46, 204, 113, 0.2)";
                blanketEl.style.borderColor = "#2ecc71";
                tempEl.style.color = "#27ae60";
                statusEl.innerText = "狀態：成功逆轉暖化！";
                statusEl.style.color = "#27ae60";
            } else {
                earthEl.innerText = "😊";
                earthEl.style.backgroundColor = "#74b9ff";
                blanketEl.style.backgroundColor = "rgba(46, 204, 113, 0.4)";
                blanketEl.style.borderColor = "#2ecc71";
                tempEl.style.color = "#2ecc71";
                statusEl.innerText = "狀態：環境平衡";
                statusEl.style.color = "#2ecc71";
            }
        }

        function makeChoice(action) {
            if (currentRound <= 0) return;
            currentRound--;

            switch(action) {
                case 'fossil':
                    co2 += 35; temp += 0.30; blanketThickness += 15; counter.fossil++;
                    logEl.innerHTML = "<b>【🏭 化石燃料】</b>燃煤發電大量排放 $CO_2$。這強化了「增強的溫室效應」，長波輻射被大量鎖死，被子明顯加厚！";
                    break;
                case 'cattle':
                    co2 += 25; temp += 0.20; blanketThickness += 12; counter.cattle++;
                    logEl.innerHTML = "<b>【🥩 肉牛放牧】</b>數億肉牛反芻釋放強烈溫室氣體——<b>甲烷 ($CH_4$)</b>。被子加速變厚，鎖熱效果顯著！";
                    break;
                case 'deforest':
                    co2 += 18; temp += 0.12; blanketThickness += 8; counter.deforest++;
                    logEl.innerHTML = "<b>【🪓 砍伐雨林】</b>大片「碳匯」消失，大氣中多餘的 $CO_2$ 無法被吸走，溫室效應積聚。";
                    break;
                case 'landfill':
                    co2 += 12; temp += 0.08; blanketThickness += 5; counter.landfill++;
                    logEl.innerHTML = "<b>【🗑️ 垃圾堆填】</b>廢物缺氧分解產生溫室氣體甲烷 ($CH_4$)，令被子持續變厚。";
                    break;

                // 綠色減緩政策
                case 'efficiency':
                    co2 -= 15; temp -= 0.15; blanketThickness -= 10; counter.efficiency++; greenChoiceCount++;
                    logEl.innerHTML = "<b>【🌱 能源效益】</b>推廣綠色低碳生活，全面補貼綠能轉型，成功從源頭減少化石燃料碳排放！";
                    break;
                case 'reforest':
                    co2 -= 18; temp -= 0.15; blanketThickness -= 10; counter.reforest++; greenChoiceCount++;
                    logEl.innerHTML = "<b>【🌱 重新造林】</b>跨國發起大規模植樹，重建地球「碳匯」，主動將大氣中的 $CO_2$ 抽回生物圈，將被子減薄！";
                    break;
                case 'carbon-tax':
                    co2 -= 10; temp -= 0.10; blanketThickness -= 5; counter.tax++; greenChoiceCount++;
                    logEl.innerHTML = "<b>【🌱 政策落實】</b>徵收高額碳稅，利用經濟手段強逼工廠走上減碳、環保轉型之路。";
                    break;
                case 'green-farm':
                    co2 -= 8; temp -= 0.10; blanketThickness -= 5; counter.farm++; greenChoiceCount++;
                    logEl.innerHTML = "<b>【🌱 農業轉型】</b>推廣低碳可持續農業與減少肉食，成功大幅降低農業甲烷與 $N_2O$ 排放。";
                    break;
            }

            updateUI();

            if (currentRound === 0) {
                setTimeout(endGame, 600);
            }
        }

        function endGame() {
            overlayEl.style.display = "flex";
            
            let isPerfectTemp = Math.abs(temp - 1.20) < 0.01;
            let isGoldenCombination = (counter.fossil === 2 && counter.cattle === 2 && counter.landfill === 1 && counter.deforest === 1);

            if (isPerfectTemp && isGoldenCombination) {
                // 結局 1：成功破解歷史真相
                resTitleEl.innerText = "🎯 完美破解！解開氣候真相！";
                resTitleEl.style.color = "#2ecc71";
                resDescEl.innerHTML = `你最終成功讓地球升溫 <b>+1.20°C</b>！<br><br><b>【地理科真相解密】</b><br>你成功拼湊出引致現代全球暖化嘅「黃金組合」：<b>2次化石燃料 + 2次肉牛放牧 + 1次濫伐林木 + 1次固體廢物處理</b>。這完美反映了現實歷史中，人類社會是如何透過這四大產業結構人為地加厚溫室氣體這張「被子」，鎖住地面<b>長波輻射</b>，製造出今日的氣候危機！`;
            } else if (greenChoiceCount >= 4) {
                // 結局 2：低碳生活逆轉趨勢（價值觀教育核心！）
                resTitleEl.innerText = "🌿 綠色奇蹟！你證明的暖化是可以逆轉的！";
                resTitleEl.style.color = "#2ecc71";
                resDescEl.innerHTML = `你最終創造的數據：全球升溫只有 <b>${temp >= 0 ? '+' : ''}${temp.toFixed(2)}°C</b>，成功讓地球阿爸過上清涼舒適的生活！<br><br><b>【價值觀教育：環保希望】</b><br>雖然這個美好的結局不符合我們當前現實世界（2026年已升溫 +1.2°C）的遺憾歷史，但你的操作證明了一個非常重要的**地理科核心價值觀**：<br><br><b>「全球暖化並非不可逆轉的絕症！」</b><br>只要人類在日常生活中願意實踐低碳生活、提高能源效益、保護森林（增加碳匯），這張人為加厚的被子完全可以被重新剪薄！你擁有非常棒的環保意識，這正是人類未來免受極端天氣災難的唯一希望！<br><br><i>（提示：你可以重新挑戰，嘗試找出是哪種「高碳排組合」導致了今天現實中 +1.20°C 的局面？）</i>`;
            } else {
                // 結局 3：不上不下的亂撳組合
                resTitleEl.innerText = "❌ 探究未能匹配現實";
                resTitleEl.style.color = "#d63031";
                resDescEl.innerHTML = `你最終全球升溫為 <b>${temp >= 0 ? '+' : ''}${temp.toFixed(2)}°C</b>。<br><br>這不符合今天現代世界的 $+1.20^\circ\text{C}$ 真相，同時也沒有採取足夠的環保措施來拯救地球。<br><br><b>【再試一次】</b>你可以嘗試尋找通往 +1.20°C 的歷史黃金組合，或者全心全意落實綠色政策（選擇 4 次或以上綠色按鈕），看看低碳生活是如何逆轉氣候趨勢的！`;
            }
        }

        function resetGame() {
            currentRound = 6;
            co2 = 280;
            temp = 0.0;
            blanketThickness = 100;
            greenChoiceCount = 0;
            for (let key in counter) counter[key] = 0;
            overlayEl.style.display = "none";
            logEl.innerHTML = "<b>【全新回合】</b>時光倒流。你可以嘗試拼湊歷史真相，或者用低碳綠色生活為地球帶來逆轉的希望！";
            updateUI();
        }

        updateUI();
    </script>
</body>
</html>
